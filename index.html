<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas en la Nube</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f7fa; }
        h1 { color: #0b5394; }
        input, button { padding: 10px; margin: 4px 0; font-size: 14px; }
        input { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { cursor: pointer; border: none; border-radius: 6px; background: #0b5394; color: white; margin-right: 6px; }
        .tarea { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin: 8px 0; display: flex; justify-content: space-between; }
        .del { background: #cc4125; padding: 6px 10px; }
    </style>
</head>
<body>
    <h1>Tareas en la Nube</h1>
    <input id="titulo" placeholder="Título">
    <input id="descripcion" placeholder="Descripción">
    <button onclick="crearTarea()">Crear</button>
    <button onclick="cargarTareas()">Cargar</button>
    <div id="resultado"></div>
    <script src="script.js"></script>
</body>
</html>
